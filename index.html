<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Ember Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one letterboxed 9:16 portrait canvas stage (720 x 1280); menus are stone tablets laid over the whole screen */
:root {
  --stone: #1b1612;
  --slab: #2c241d;
  --slab-edge: #120e0b;
  --ember: #f39a35;
  --ember-deep: #b8561a;
  --glow: #ffd58e;
  --teal: #5ad6c4;
  --cream: #fff1da;
  --muted: #c4ae92;
  --blood: #e2513a;
  --display: "Lilita One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stone);
  color: var(--cream);
  font-family: var(--body);
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#stage { position: relative; width: 360px; height: 640px; max-width: 100%; }
#game { display: block; width: 100%; height: 100%; border-radius: 14px; background: #0d0a08; cursor: pointer; touch-action: none; }

#pauseBtn {
  position: absolute; top: 1.6%; right: 3%;
  width: clamp(36px, 8%, 56px); aspect-ratio: 1; max-width: 100%;
  border-radius: 12px; border: 3px solid var(--slab-edge);
  background: var(--slab); color: var(--cream);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 4px 0 var(--slab-edge);
}
#pauseBtn svg { width: 46%; height: 46%; fill: currentColor; }
#pauseBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--slab-edge); }

.panel {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(14, 10, 8, 0.58);
  overflow-y: auto;
}
.panel.clear { background: transparent; pointer-events: none; }
.panel.clear > * { pointer-events: auto; }
.tablet {
  background: var(--slab);
  border: 4px solid var(--slab-edge);
  border-radius: 22px;
  box-shadow: 0 8px 0 var(--slab-edge), 0 24px 60px rgba(0, 0, 0, 0.45);
  padding: clamp(18px, 3vw, 34px);
  width: min(440px, 100%);
  display: grid; gap: 14px;
  text-align: center;
}
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
h2 { font-size: clamp(28px, 4.4vw, 46px); color: var(--glow); text-shadow: 0 4px 0 var(--slab-edge); }
p { margin: 0; line-height: 1.45; }
.sub { color: var(--muted); font-weight: 600; font-size: clamp(14px, 1.5vw, 17px); }

/* Title screen sits on the right, leaving the hero and campfire visible */
#title { place-items: end center; background: transparent; }
#title .tablet { width: min(340px, 100%); margin-bottom: 3vh; gap: 10px; padding: 16px 18px 14px; background: rgba(44, 36, 29, 0.92); }
#title .sub { font-size: 15px; }
.btn.small { font-size: 16px; padding: 8px 6px; }
.btn.small[aria-pressed="false"] { color: var(--muted); }
.bests { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: center; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.bests b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0; color: var(--glow); font-variant-numeric: tabular-nums; }
.bests span { color: #5b4a3c; margin: 0 4px; }
.logo {
  font-size: clamp(38px, 10vw, 54px); line-height: 0.88;
  color: var(--ember);
  text-shadow: 0 5px 0 var(--ember-deep), 0 10px 0 var(--slab-edge);
}
.logo span { display: block; color: var(--glow); }

.btn {
  font-family: var(--display); font-size: clamp(20px, 2.3vw, 26px); letter-spacing: 0.04em;
  border: 3px solid var(--slab-edge); border-radius: 14px;
  padding: 12px 18px; cursor: pointer;
  background: var(--ember); color: #2a1406;
  box-shadow: 0 6px 0 var(--ember-deep), 0 8px 0 var(--slab-edge);
  transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ember-deep), 0 3px 0 var(--slab-edge); }
.btn.alt { background: #4a3d32; color: var(--cream); box-shadow: 0 6px 0 #2f261f, 0 8px 0 var(--slab-edge); }
.btn.alt:active { box-shadow: 0 1px 0 #2f261f, 0 3px 0 var(--slab-edge); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn:focus-visible, #pauseBtn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.row { display: flex; gap: 10px; }
.row > .btn { flex: 1; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: rgba(0, 0, 0, 0.22); border-radius: 12px; padding: 10px 8px; display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 2.6vw, 30px); color: var(--cream); font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stat.hot b { color: var(--glow); }
.chip { justify-self: center; font-weight: 900; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--teal); color: #0d2a26; padding: 4px 12px; border-radius: 99px; }

.bank { display: inline-flex; align-items: center; gap: 6px; justify-self: center; font-family: var(--display); font-size: 22px; color: var(--glow); font-variant-numeric: tabular-nums; }
.bank img { width: 20px; height: auto; }
.ups { display: grid; gap: 10px; text-align: left; }
.up { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: rgba(0, 0, 0, 0.22); border-radius: 14px; padding: 12px 14px; }
.up h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--cream); letter-spacing: 0.02em; }
.up p { grid-column: 1; font-size: 14px; color: var(--muted); font-weight: 600; min-width: 0; }
.up .btn { grid-row: 1 / span 3; grid-column: 2; font-size: 17px; padding: 8px 12px; min-width: 88px; }
.pips { display: flex; gap: 5px; }
.pips i { width: 18px; height: 7px; border-radius: 4px; background: #4a3d32; }
.pips i.on { background: var(--teal); }
#loading { font-family: var(--display); font-size: 26px; color: var(--glow); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game" aria-label="Ember Hollow game. Tap or press Space to turn around."></canvas>
  <button id="pauseBtn" aria-label="Pause" hidden><svg viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.6" height="8" rx="0.8"/><rect x="5.9" y="1" width="2.6" height="8" rx="0.8"/></svg></button>
</div>

<div class="panel" id="loadPanel"><div id="loading">Lighting the campfire...</div></div>

<div class="panel clear" id="title" hidden>
  <div class="tablet">
    <h1 class="logo">Ember<span>Hollow</span></h1>
    <p class="sub">Grab gems. Bank them. Dodge the rocks.</p>
    <button class="btn" id="playBtn">Play</button>
    <div class="row">
      <button class="btn alt small" id="shopBtn">Trader</button>
      <button class="btn alt small" id="musicBtn" aria-pressed="true">Music on</button>
      <button class="btn alt small" id="soundBtn" aria-pressed="true">Sound on</button>
    </div>
    <p class="bests">Best haul <b id="tBest">0</b><span aria-hidden="true">|</span>Best wave <b id="tWave">-</b></p>
  </div>
</div>

<div class="panel" id="shop" hidden>
  <div class="tablet">
    <h2>The Trader</h2>
    <div class="bank"><img src="assets/crystal.png" alt=""><span id="sBank">0</span> gems</div>
    <div class="ups" id="ups"></div>
    <button class="btn alt" id="shopBack">Back</button>
  </div>
</div>

<div class="panel" id="pause" hidden>
  <div class="tablet">
    <h2>Resting</h2>
    <button class="btn" id="resumeBtn">Resume</button>
    <div class="row">
      <button class="btn alt" id="restartBtn">Restart</button>
      <button class="btn alt" id="menuBtn">Camp</button>
    </div>
  </div>
</div>

<div class="panel" id="over" hidden>
  <div class="tablet">
    <h2>Flattened!</h2>
    <span class="chip" id="newBest" hidden>New best haul</span>
    <span class="chip" id="newWave" hidden>New best wave</span>
    <div class="stats">
      <div class="stat hot"><small>Wave</small><b id="oWaveN">1</b></div>
      <div class="stat"><small>Best wave</small><b id="oBestWave">1</b></div>
      <div class="stat hot"><small>Haul</small><b id="oScore">0</b></div>
      <div class="stat"><small>Best</small><b id="oBest">0</b></div>
      <div class="stat"><small>Gems banked</small><b id="oGems">0</b></div>
      <div class="stat"><small>Survived</small><b id="oTime">0:00</b></div>
    </div>
    <p class="sub" id="oWave">You reached wave 1.</p>
    <div class="row">
      <button class="btn" id="againBtn">Run again</button>
      <button class="btn alt" id="overMenuBtn">Camp</button>
    </div>
  </div>
</div>

<script>
(() => {
  // World is laid out in a fixed 1280 x 720 space and scaled to the stage.
  const W = 720, H = 1280;
  const GROUND = 1150;         // where feet touch the cave floor
  const HOME_X = 170;          // wall bank edge: carry a gem past this to stash it
  const BANK_X = 104, BANK_Y = 610, BANK_W = 150, BANK_H = 118; // stone vault in the left wall
  const LEFT = 60, RIGHT = 662;
  const HERO_H = 132, HERO_W = 119;
  const ROCK_W = 50, ROCK_H = 166;
  const GEM_W = 38, GEM_H = 49;
  const WAVE_LEN = 24;
  const RUSH = 5;               // seconds: bank a gem inside this window for a speed bonus
  const RUSH_MAX = 30;          // speed bonus for an instant bank, shrinking to 0 at RUSH
  const SLOW_SCALE = 0.35;      // how fast rocks move while slow time is on
  const SLOW_LEN = 4;           // seconds of slow time from one blue gem
  const DROP_Y = -ROCK_H - 20;  // rocks start just above the screen and fall straight in

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');

  // ---------- save data ----------
  const SAVE_KEY = 'ember-hollow-v1';
  const save = { best: 0, bestWave: 0, bank: 0, sound: true, music: true, up: { sense: 0, feet: 0, reach: 0 } };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) { Object.assign(save, s); save.up = Object.assign({ sense: 0, feet: 0, reach: 0 }, s.up); }
  } catch (e) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

  const UPGRADES = [
    { id: 'sense', name: 'Keen Ears', desc: 'Hear the ceiling crack 15% sooner for each level.', costs: [15, 40] },
    { id: 'feet', name: 'Quick Feet', desc: 'Run 8% faster for each level.', costs: [10, 25, 50] },
    { id: 'reach', name: 'Long Arms', desc: 'Grab gems from further away.', costs: [10, 25, 50] },
  ];

  // ---------- sound (all synthesised with Web Audio, no files) ----------
  // Two buses: sound effects and music, each with its own on/off switch.
  let actx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  function ctxReady() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4;
        master = actx.createGain(); master.gain.value = 0.9;
        sfxBus = actx.createGain(); sfxBus.gain.value = 0.85;
        musicBus = actx.createGain(); musicBus.gain.value = 0.32;
        sfxBus.connect(master); musicBus.connect(master); master.connect(comp).connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);

  // one enveloped oscillator note
  function note(bus, freq, t0, dur, { type = 'triangle', vol = 0.1, slide = 0, attack = 0.005, vibrato = 0, cutoff = 0 } = {}) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    if (vibrato) {
      const lfo = actx.createOscillator(), lg = actx.createGain();
      lfo.frequency.value = 5.5; lg.gain.value = vibrato; lfo.connect(lg).connect(o.frequency);
      lfo.start(t0); lfo.stop(t0 + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let out = o;
    if (cutoff) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); out = f; }
    out.connect(g).connect(bus);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // a filtered burst of noise (rock smash, shaker, dust)
  function hiss(bus, t0, dur, { vol = 0.2, type = 'lowpass', freq = 900, q = 0.7 } = {}) {
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(bus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  }

  // sound effects: each one checks the Sound switch
  function fx(play) { if (!save.sound || !ctxReady()) return; play(actx.currentTime); }
  const sfx = {
    turn: () => fx((t) => { hiss(sfxBus, t, 0.06, { vol: 0.12, type: 'bandpass', freq: 1800, q: 2 }); }),
    // gem pickup: a bright crystal chime that sparkles upward
    pick: () => fx((t) => {
      [88, 92, 95, 100].forEach((n, i) => {
        note(sfxBus, midi(n), t + i * 0.045, 0.35, { type: 'sine', vol: 0.16 });
        note(sfxBus, midi(n + 12), t + i * 0.045, 0.2, { type: 'triangle', vol: 0.05 });
      });
    }),
    // banking: the gem clinks into the stone vault, then a rising reward run (higher with a streak)
    bank: (streak = 0) => fx((t) => {
      hiss(sfxBus, t, 0.12, { vol: 0.3, type: 'bandpass', freq: 3200, q: 6 });
      note(sfxBus, 110, t, 0.18, { type: 'sine', vol: 0.3, slide: -50 });
      const up = Math.min(streak, 6);
      [76, 79, 83, 88, 91].forEach((n, i) => note(sfxBus, midi(n + up), t + 0.08 + i * 0.06, 0.28, { type: 'square', vol: 0.045, cutoff: 3200 }));
      note(sfxBus, midi(95 + up), t + 0.4, 0.6, { type: 'sine', vol: 0.14 });
    }),
    // a rock breaking off the ceiling
    crack: () => fx((t) => { for (let i = 0; i < 3; i++) hiss(sfxBus, t + i * 0.04, 0.05, { vol: 0.07, type: 'highpass', freq: 2500 }); }),
    // a rock smashing on the floor
    crash: () => fx((t) => {
      hiss(sfxBus, t, 0.4, { vol: 0.35, freq: 800 });
      hiss(sfxBus, t, 0.12, { vol: 0.2, type: 'highpass', freq: 3000 });
      note(sfxBus, 90, t, 0.3, { type: 'sine', vol: 0.4, slide: -50 });
    }),
    // the rock lands on the caveman's head
    bonk: () => fx((t) => {
      note(sfxBus, 520, t, 0.25, { type: 'square', vol: 0.12, slide: -360, cutoff: 2400 });
      hiss(sfxBus, t, 0.5, { vol: 0.45, freq: 600 });
      note(sfxBus, 70, t, 0.6, { type: 'sine', vol: 0.6, slide: -35 });
      [0, 1, 2].forEach((i) => note(sfxBus, midi(84 + i * 3), t + 0.25 + i * 0.09, 0.2, { type: 'sine', vol: 0.06 }));
    }),
    // game over: a slow, sad tune on the cave flute
    lose: () => fx((t) => {
      [[69, 0], [67, 0.28], [64, 0.56], [62, 0.84], [57, 1.2]].forEach(([n, d], i, arr) =>
        note(sfxBus, midi(n), t + 0.5 + d, i === arr.length - 1 ? 1.4 : 0.32, { type: 'triangle', vol: 0.16, vibrato: 4, attack: 0.03 }));
      [45, 41].forEach((n, i) => note(sfxBus, midi(n), t + 0.5 + i * 0.7, 0.9, { type: 'sine', vol: 0.18 }));
    }),
    // a new wave: a short drum roll and rising horn
    wave: () => fx((t) => {
      for (let i = 0; i < 6; i++) note(sfxBus, 150 - i * 6, t + i * 0.05, 0.08, { type: 'sine', vol: 0.18, slide: -40 });
      [57, 64, 69].forEach((n, i) => note(sfxBus, midi(n + 12), t + 0.3 + i * 0.11, 0.3, { type: 'sawtooth', vol: 0.05, cutoff: 1800, attack: 0.02 }));
    }),
    tick: () => fx((t) => note(sfxBus, 660, t, 0.1, { type: 'square', vol: 0.06, cutoff: 2000 })),
    go: () => fx((t) => note(sfxBus, 990, t, 0.25, { type: 'square', vol: 0.06, cutoff: 2600 })),
    buy: () => fx((t) => [72, 79, 84].forEach((n, i) => note(sfxBus, midi(n), t + i * 0.07, 0.2, { type: 'triangle', vol: 0.12 }))),
    // the speed bonus: a crackle of lightning on top of the bank chime
    lightning: () => fx((t) => {
      hiss(sfxBus, t + 0.05, 0.25, { vol: 0.22, type: 'highpass', freq: 4000 });
      [96, 100, 103, 108].forEach((n, i) => note(sfxBus, midi(n), t + 0.05 + i * 0.03, 0.25, { type: 'square', vol: 0.03, cutoff: 6000 }));
    }),
    // a blue gem appears
    chime: () => fx((t) => [91, 98].forEach((n, i) => note(sfxBus, midi(n), t + i * 0.12, 0.6, { type: 'sine', vol: 0.09 }))),
    // slow time on: a long falling whoosh; off: it rises back
    slowIn: () => fx((t) => { note(sfxBus, 900, t, 0.7, { type: 'sine', vol: 0.18, slide: -760 }); hiss(sfxBus, t, 0.7, { vol: 0.15, type: 'bandpass', freq: 700, q: 1 }); }),
    slowOut: () => fx((t) => { note(sfxBus, 150, t, 0.45, { type: 'sine', vol: 0.15, slide: 700 }); hiss(sfxBus, t, 0.4, { vol: 0.1, type: 'bandpass', freq: 1500, q: 1 }); }),
    click: () => fx((t) => hiss(sfxBus, t, 0.04, { vol: 0.12, type: 'bandpass', freq: 1400, q: 3 })),
  };

  // Background music: a looping tribal-percussion tune in A minor.
  // 'title' is calm and slow; 'run' adds drums and speeds up with every wave.
  const SONG = {
    lead: [
      0, null, 3, null, 7, null, 10, 7, 12, null, 10, null, 7, null, 5, null,
      8, null, 7, null, 5, null, 3, null, 5, null, 7, null, 3, null, null, null,
      7, null, 10, null, 12, null, 10, 7, 3, null, 7, null, 10, null, 12, null,
      10, null, 7, null, 5, null, 2, null, 3, null, 2, null, -2, null, null, null,
    ],
    roots: [45, 41, 48, 43],                       // A, F, C, G
    chords: [[0, 3, 7], [0, 4, 7], [0, 4, 7], [0, 4, 7]],
  };
  const Music = {
    mode: null, step: 0, next: 0, timer: null, bpm: 100,
    play(mode) {
      if (this.mode === mode && this.timer) return;
      this.stop();
      if (!save.music || !ctxReady()) { this.mode = mode; return; }
      this.mode = mode; this.step = 0; this.next = actx.currentTime + 0.08;
      musicBus.gain.cancelScheduledValues(actx.currentTime);
      musicBus.gain.setValueAtTime(0.0001, actx.currentTime);
      musicBus.gain.exponentialRampToValueAtTime(mode === 'run' ? 0.32 : 0.26, actx.currentTime + 0.6);
      this.timer = setInterval(() => this.pump(), 25);
    },
    stop() {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      if (actx && musicBus) { musicBus.gain.cancelScheduledValues(actx.currentTime); musicBus.gain.setTargetAtTime(0.0001, actx.currentTime, 0.08); }
    },
    resume() { const m = this.mode; this.mode = null; if (m) this.play(m); },
    pump() {
      if (!actx) return;
      this.bpm = this.mode === 'run' ? Math.min(176, 116 + 6 * ((G ? G.wave : 1) - 1)) * (G && G.slow > 0 ? 0.55 : 1) : 92;
      const stepLen = 60 / this.bpm / 4;
      if (this.next < actx.currentTime - 0.1) this.next = actx.currentTime + 0.05;   // timer was throttled: skip ahead, don't pile up notes
      while (this.next < actx.currentTime + 0.12) { this.beat(this.step, this.next, stepLen); this.next += stepLen; this.step = (this.step + 1) % 64; }
    },
    beat(s, t, len) {

  window.addEventListener('keydown', unlock);

  // ---------- images ----------

  // ---------- sizing ----------
  let scale = 1, dpr = 1;

  // ---------- state ----------

  function newRun() {
    G = {
      startBestWave: save.bestWave,
      t: 0, wave: 1, waveT: 0, spawnT: 1.4,
      score: 0, delivered: 0, streak: 0,
      hero: { x: 300, dir: 1, carry: false, pickX: 0, inv: 0, run: 0 },
      rocks: [], gems: [], parts: [], texts: [], flying: [], banked: 0, gemT: 0.6,
      shake: 0, banner: { text: 'Wave 1', sub: 'Hold left or right to run', t: 2.4 }, flash: 0,

  }

  // ---------- difficulty ----------
  const warnTime = (w) => Math.max(0.2, 0.45 - 0.03 * (w - 1)) * (1 + 0.15 * save.up.sense);   // floor shadow only
  const gravity = (w) => 2800 + 320 * (w - 1);
  const dropSpeed = (w) => 450 + 50 * (w - 1);   // rocks leave the ceiling already moving
  const spawnGap = (w) => Math.max(0.36, 1.2 - 0.1 * (w - 1)) * (0.75 + Math.random() * 0.5);
  const doubleChance = (w) => (w < 2 ? 0 : Math.min(0.55, (w - 1) * 0.12));

  function spawnRock() {
    let x, tries = 0;
    do {
      x = HOME_X + 30 + Math.random() * (RIGHT - HOME_X - 30);
      tries++;
    } while (tries < 8 && G.rocks.some((r) => Math.abs(r.x - x) < 60));

    G.rocks.push({ x, y: DROP_Y, vy: dropSpeed(G.wave), warn: warnTime(G.wave), max: warnTime(G.wave), rot: 0 });
  }

  function spawnGem() {
    let x, tries = 0;
    do { x = HOME_X + 110 + Math.random() * (RIGHT - HOME_X - 120); tries++; }
    while (tries < 10 && (Math.abs(x - G.hero.x) < 140 || G.gems.some((c) => Math.abs(c.x - x) < 120)));

  // A rare blue gem: touch it to slow the falling rocks for a few seconds.
  function spawnSlowGem() {
    let x, tries = 0;
    do { x = HOME_X + 60 + Math.random() * (RIGHT - HOME_X - 70); tries++; }
    while (tries < 10 && (Math.abs(x - G.hero.x) < 170 || G.gems.some((c) => Math.abs(c.x - x) < 90)));

  }

  function burst(x, y, n, kind) {
    for (let i = 0; i < n; i++) {
      const a = kind === 'spark' ? Math.random() * Math.PI * 2 : -Math.PI * (0.1 + Math.random() * 0.8);
      const sp = kind === 'spark' ? 120 + Math.random() * 260 : 160 + Math.random() * 320;
      G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.5, t: 0, kind, s: kind === 'spark' ? 2 + Math.random() * 3 : 5 + Math.random() * 8, r: Math.random() * 6 });
    }
  }
  function floatText(x, y, text, color) { G.texts.push({ x, y, text, color, t: 0 }); }

  // ---------- input ----------
  // The caveman only moves while you hold: left half of the screen runs left, right half runs right.
  // Whatever was pressed most recently wins, so rolling from one thumb to the other feels instant.
  const held = [];   // stack of { id, side }
  function press(id, side) { release(id); held.push({ id, side }); }
  function release(id) { const i = held.findIndex((h) => h.id === id); if (i >= 0) held.splice(i, 1); }
  const steer = () => (held.length ? held[held.length - 1].side : 0);
  const sideOf = (e) => { const r = cv.getBoundingClientRect(); return e.clientX - r.left < r.width / 2 ? -1 : 1; };
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} press('p' + e.pointerId, sideOf(e)); });
  cv.addEventListener('pointermove', (e) => { const h = held.find((x) => x.id === 'p' + e.pointerId); if (h) h.side = sideOf(e); });

  const KEY_SIDE = { ArrowLeft: -1, a: -1, A: -1, ArrowRight: 1, d: 1, D: 1 };
  window.addEventListener('keyup', (e) => { if (KEY_SIDE[e.key]) release('k' + e.key.toLowerCase()); });
  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (e.repeat) return;

      if (k === 'p' || k === 'Escape') pauseGame();
    } else if (mode === 'paused' && (k === 'p' || k === 'Escape')) resumeGame();

  });
  document.addEventListener('visibilitychange', () => {

  });

  // ---------- screens ----------
  const panels = ['title', 'shop', 'pause', 'over', 'loadPanel'];
  function show(id) { panels.forEach((p) => { $(p).hidden = p !== id; }); $('pauseBtn').hidden = !(mode === 'play' || mode === 'countdown'); }

  function goTitle() {
    mode = 'title'; G = null;
    $('tBest').textContent = save.best; $('tWave').textContent = save.bestWave || '-';
    syncToggles();
    Music.play('title');
    show('title');
  }
  function startGame() { held.length = 0; newRun(); mode = 'play'; show(null); sfx.wave(); Music.play('run'); }
  function pauseGame() { if (mode !== 'play' && mode !== 'countdown') return; mode = 'paused'; Music.stop(); show('pause'); $('resumeBtn').focus(); }
  function resumeGame() { mode = 'countdown'; countdown = 3; countLast = 4; show(null); }
  function gameOver() {
    mode = 'over';
    const isBest = G.score > save.best;
    const isBestWave = G.wave > G.startBestWave;
    save.best = Math.max(save.best, G.score);
    save.bestWave = Math.max(save.bestWave, G.wave);
    save.bank += G.delivered;
    persist();
    $('oScore').textContent = G.score; $('oBest').textContent = save.best;
    $('oGems').textContent = '+' + G.delivered; $('oTime').textContent = clock(G.t);
    $('oWave').textContent = 'Banked gems carry over to the Trader.';
    $('newBest').hidden = !isBest; $('newWave').hidden = !isBestWave;
    $('oWaveN').textContent = G.wave; $('oBestWave').textContent = save.bestWave;
    setTimeout(() => { if (mode === 'over') { show('over'); $('againBtn').focus(); } }, 900);
    $('pauseBtn').hidden = true;

  function renderShop() {
    $('sBank').textContent = save.bank;

      const lvl = save.up[u.id], maxed = lvl >= u.costs.length, cost = u.costs[lvl];
      const el = document.createElement('div'); el.className = 'up';
      el.innerHTML = `<h3>${u.name}</h3><p>${u.desc}</p><div class="pips">${u.costs.map((_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div>`;
      const b = document.createElement('button'); b.className = 'btn'; b.id = 'buy-' + u.id;

  $('shopBack').addEventListener('click', goTitle);

    $('musicBtn').textContent = save.music ? 'Music on' : 'Music off'; $('musicBtn').setAttribute('aria-pressed', save.music);
  }
  $('soundBtn').addEventListener('click', () => { save.sound = !save.sound; persist(); syncToggles(); sfx.buy(); });
  $('musicBtn').addEventListener('click', () => { save.music = !save.music; persist(); syncToggles(); if (save.music) Music.resume(); else Music.stop(); });

  $('pauseBtn').addEventListener('click', pauseGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('restartBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', goTitle);
  $('againBtn').addEventListener('click', startGame);
  $('overMenuBtn').addEventListener('click', goTitle);

  const clock = (t) => { const s = Math.floor(t); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // ---------- update ----------
  function update(dt) {
    for (const m of motes) { m.y += m.v * dt; m.p += dt; if (m.y > GROUND) { m.y = -5; m.x = Math.random() * W; } }

    if (mode === 'title' || mode === 'shop') { idleHero.run += dt; return; }
    if (mode === 'countdown') {
      countdown -= dt;
      const n = Math.ceil(countdown);
      if (n !== countLast && n > 0) { countLast = n; sfx.tick(); }
      if (countdown <= 0) { mode = 'play'; sfx.go(); show(null); Music.resume(); }
      return;
    }
    if (!G || mode === 'paused') return;

    // particles and text keep animating on the game over beat
    for (const p of G.parts) { p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind !== 'spark' && p.y > GROUND) { p.y = GROUND; p.vx *= 0.6; p.vy *= -0.3; } }
    G.parts = G.parts.filter((p) => p.t < p.life);

    G.flash = Math.max(0, G.flash - dt * 2.5);
    G.pulse = Math.max(0, G.pulse - dt * 1.6);
    if (mode !== 'play') return;

    G.t += dt;
    G.banner.t -= dt;

    // waves
    G.waveT += dt;
    if (G.waveT >= WAVE_LEN) {
      G.waveT = 0; G.wave++; G.banner = { text: 'Wave ' + G.wave, sub: 'SPEED UP!', subColor: '#5ad6c4', t: 2.2 }; sfx.wave();
      G.pulse = 1; G.shake = Math.max(G.shake, 6);
      if (G.wave > save.bestWave) { save.bestWave = G.wave; persist(); }   // kept on this device even if the tab closes mid-run
    }

    // slow time: rocks (and their spawning) run at SLOW_SCALE, the caveman keeps full speed
    if (G.slow > 0) { G.slow -= dt; if (G.slow <= 0) { G.slow = 0; sfx.slowOut(); } }
    const ts = G.slow > 0 ? SLOW_SCALE : 1, rdt = dt * ts;

    // spawning
    G.spawnT -= rdt;
    if (G.spawnT <= 0) {
      spawnRock();
      if (Math.random() < doubleChance(G.wave)) spawnRock();
      G.spawnT = spawnGap(G.wave);
    }

    // hero
    const h = G.hero;
    h.run += dt; h.inv = Math.max(0, h.inv - dt);
    const move = steer();

    if (move) h.dir = move;
    if (h.moving) h.x = Math.min(RIGHT, Math.max(LEFT, h.x + move * heroSpeed() * dt));
    // running dust kicks up behind the caveman, thicker as he gets faster
    if (h.moving && (G.dustT -= dt) <= 0) {
      G.dustT = 0.07 / waveBoost();
      G.parts.push({ x: h.x - h.dir * 30, y: GROUND - 6, vx: -h.dir * (60 + Math.random() * 90), vy: -70 - Math.random() * 80, life: 0.3 + Math.random() * 0.2, t: 0, kind: 'dust', s: 4 + Math.random() * 5, r: 0 });
    }

    // rocks
    const g = gravity(G.wave);
    for (const r of G.rocks) {

      r.vy += g * rdt; r.y += r.vy * rdt;
      const tip = r.y + ROCK_H;

    // gems on the floor
    // only one gem at a time: the next appears after the last one is banked
    if (G.gems.length || h.carry || G.flying.length) G.gemT = 0.5;

      }
    }
    G.gems = G.gems.filter((c) => !c.taken);
    if (G.clockOn) G.gemClock += dt;

    // blue slow-time gem
    if (!G.slowGem) { if ((G.slowT -= dt) <= 0) spawnSlowGem(); }
    else {
      const sg = G.slowGem; sg.t += dt; sg.life -= dt;
      if (Math.abs(sg.x - h.x) < reach()) {
        G.slowGem = null; G.slowT = 15 + Math.random() * 8;
        G.slow = SLOW_LEN; sfx.slowIn();
        burst(sg.x, GROUND - 30, 16, 'spark');
        G.banner = { text: 'Slow time!', sub: 'Rocks slowed for ' + SLOW_LEN + 's', color: '#8fd8ff', subColor: '#fff1da', t: 1.6 };
      } else if (sg.life <= 0) { G.slowGem = null; G.slowT = 10 + Math.random() * 6; burst(sg.x, GROUND - 16, 6, 'dust'); }
    }

    for (const f of G.flying) {

  }

  function hurt(r) {

  }

  // ---------- draw ----------
  function drawHero(h, t, idle) {
    const bob = idle || h.dead ? (h.dead ? 0 : Math.sin(t * 2.4) * 2.5) : Math.abs(Math.sin(t * 13)) * 9;
    const tilt = idle ? 0 : 0.06;
    const y = GROUND - HERO_H - bob;
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(h.x, GROUND + 2, 46, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = h.inv > 0 && Math.floor(h.inv * 12) % 2 === 0 ? 0.35 : 1;
    ctx.translate(h.x, y + HERO_H);
    ctx.scale(h.dir, 1);
    ctx.rotate(h.dead ? 0 : tilt);
    if (h.dead) ctx.scale(1.25, 0.5);   // flattened by the rock
    if (img.hero.complete && img.hero.naturalWidth) ctx.drawImage(img.hero, -HERO_W / 2, -HERO_H, HERO_W, HERO_H);
    ctx.restore();
    if (!idle && !h.dead && G) {
      // speed streaks trailing the caveman, longer as the waves speed him up
      const len = 40 * waveBoost();
      ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 4;
      [0.3, 0.52, 0.74].forEach((f, i) => {
        const yy = GROUND - HERO_H * f, x0 = h.x - h.dir * (HERO_W * 0.42 + i * 6);
        const gr = ctx.createLinearGradient(x0, 0, x0 - h.dir * len, 0);
        gr.addColorStop(0, 'rgba(255,236,200,0.55)'); gr.addColorStop(1, 'rgba(255,236,200,0)');

      });
      ctx.restore();
    }
    if (h.carry) { const gy = y - 26 + Math.sin(t * 13) * 2; drawRush(h.x + h.dir * 4, gy); drawGem(h.x + h.dir * 4, gy, 1.05, t); }
    if (h.dead) {
      // dizzy stars circling the flattened caveman
      const now = performance.now() / 1000;
      for (let i = 0; i < 3; i++) {
        const a = now * 4 + i * 2.1;
        label('*', h.x + Math.cos(a) * 46, GROUND - HERO_H * 0.62 + Math.sin(a) * 12, 34, '#ffd58e', 'center');
      }
    }
  }
  function drawGem(x, y, s, t, blue) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(x, y, 2, x, y, 46 * s);
    rg.addColorStop(0, blue ? `rgba(120,200,255,${0.55 + Math.sin(t * 7) * 0.15})` : `rgba(255,200,110,${0.45 + Math.sin(t * 5) * 0.12})`);
    rg.addColorStop(1, blue ? 'rgba(60,140,255,0)' : 'rgba(255,150,40,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, 46 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const im = blue ? img.blueGem : img.crystal;
    if (im && (im.naturalWidth || im.width)) ctx.drawImage(im, x - GEM_W * s / 2, y - GEM_H * s / 2, GEM_W * s, GEM_H * s);
  }
  // The speed-bonus clock: a ring around the gem that drains over RUSH seconds.
  function drawRush(x, y) {
    if (!G || !G.clockOn) return;
    const f = 1 - G.gemClock / RUSH;
    if (f <= 0) return;
    ctx.save();
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(18,14,11,0.6)'; ctx.beginPath(); ctx.arc(x, y, 36, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = f > 0.6 ? '#8fd8ff' : f > 0.3 ? '#5ad6c4' : '#f39a35';
    ctx.beginPath(); ctx.arc(x, y, 36, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // A stone vault carved into the left cave wall. Banked gems stack up inside it.
  function drawBank(count, t) {
    const x = BANK_X - BANK_W / 2, y = BANK_Y;
    ctx.save();
    // rough stone rim
    ctx.fillStyle = '#5b4a3c'; ctx.strokeStyle = '#120e0b'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(x - 14, y - 14, BANK_W + 28, BANK_H + 28, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a6552';
    for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(x - 6 + i * 27, y - 8 + (i % 2) * 3, 7, 0, Math.PI * 2); ctx.fill(); }
    // dark hollow
    const hg = ctx.createLinearGradient(0, y, 0, y + BANK_H);
    hg.addColorStop(0, '#0b0806'); hg.addColorStop(1, '#241a13');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.roundRect(x, y, BANK_W, BANK_H, 12); ctx.fill();
    ctx.lineWidth = 3; ctx.stroke();
    // stacked gems, bottom row first
    ctx.beginPath(); ctx.roundRect(x, y, BANK_W, BANK_H, 12); ctx.clip();
    const shown = Math.min(count, 28), perRow = 7, gw = 20, gh = 26;
    for (let i = 0; i < shown; i++) {
      const row = Math.floor(i / perRow), col = i % perRow;
      const gx = x + 12 + col * gw + (row % 2) * 8, gy = y + BANK_H - gh - 6 - row * (gh - 6);
      if (img.crystal.naturalWidth) ctx.drawImage(img.crystal, gx, gy, gw, gh);
    }
    if (shown) {
      ctx.globalCompositeOperation = 'lighter';
      const gl = ctx.createRadialGradient(BANK_X, y + BANK_H, 4, BANK_X, y + BANK_H, BANK_W * 0.8);
      gl.addColorStop(0, `rgba(255,170,70,${0.18 + Math.min(shown, 20) * 0.012 + Math.sin(t * 3) * 0.03})`); gl.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = gl; ctx.fillRect(x, y, BANK_W, BANK_H);
    }
    ctx.restore();
    // carved plaque
    ctx.fillStyle = '#5b4a3c'; ctx.strokeStyle = '#120e0b'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(BANK_X - 58, y + BANK_H + 4, 116, 38, 10); ctx.fill(); ctx.stroke();
    label('BANK ' + count, BANK_X, y + BANK_H + 24, 24, '#ffd58e', 'center');
  }

  function label(text, x, y, size, color, align = 'left') {
    ctx.font = `${size}px "Lilita One", "Arial Black", Impact, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = '#120e0b';
    ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
  }

  function draw(now) {
    const t = now / 1000;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.save();
    if (G && G.pulse > 0) { const z = 1 + 0.035 * G.pulse; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); }
    if (G && G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);

    if (img.bg.naturalWidth) ctx.drawImage(img.bg, -10, -10, W + 20, H + 20);
    else { ctx.fillStyle = '#1b1612'; ctx.fillRect(0, 0, W, H); }

    // campfire light
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const fl = 0.22 + Math.sin(t * 9) * 0.03 + Math.sin(t * 23) * 0.02 + (G ? G.flash * 0.4 : 0);
    const cg = ctx.createRadialGradient(160, 930, 10, 160, 930, 300);
    cg.addColorStop(0, `rgba(255,160,60,${fl})`); cg.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = cg; ctx.fillRect(0, 630, 460, 600);
    ctx.restore();

    drawBank(G ? G.banked : save.bank, t);

    // dust motes
    ctx.fillStyle = 'rgba(255,225,170,0.35)';
    for (const m of motes) { ctx.beginPath(); ctx.arc(m.x + Math.sin(m.p) * 6, m.y, m.s, 0, Math.PI * 2); ctx.fill(); }

    if (G) {
      const h = G.hero;
      // camp marker when carrying
      if (h.carry && mode === 'play') {
        const a = 0.55 + Math.sin(t * 8) * 0.35;
        ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#ffd58e';
        for (let i = 0; i < 3; i++) {
          const x = HOME_X + 20 + i * 26 - ((t * 60) % 26);
          ctx.beginPath(); ctx.moveTo(x, GROUND - 40); ctx.lineTo(x + 14, GROUND - 52); ctx.lineTo(x + 14, GROUND - 28); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      // warnings and shadows
      for (const r of G.rocks) {
        const p = r.warn > 0 ? 1 - r.warn / r.max : 1;
        const fall = r.warn > 0 ? 0 : Math.min(1, (r.y + ROCK_H) / GROUND);
        ctx.fillStyle = `rgba(0,0,0,${0.18 + 0.35 * Math.max(p * 0.6, fall)})`;
        ctx.beginPath(); ctx.ellipse(r.x, GROUND + 2, 14 + 26 * Math.max(p * 0.6, fall), 6, 0, 0, Math.PI * 2); ctx.fill();
        if (r.warn > 0) {
          // a little grit trickles from the ceiling where the rock is about to come through
          ctx.fillStyle = 'rgba(230,190,130,0.85)';
          for (let i = 0; i < 4; i++) { const yy = ((t * 300 + i * 45) % 140) + 6; ctx.fillRect(r.x - 14 + i * 9 + Math.sin(t * 30 + i) * 2, yy, 3, 3); }
        }
      }
      // gems
      for (const c of G.gems) {
        const gy = GROUND - GEM_H / 2 - 2 - c.h + Math.sin(c.t * 4) * 2;
        drawRush(c.x, gy); drawGem(c.x, gy, 0.4 + 0.6 * c.pop, t + c.x);
      }
      if (G.slowGem) {
        const sg = G.slowGem;
        if (!(sg.life < 1.5 && Math.floor(sg.life * 8) % 2 === 0)) drawGem(sg.x, GROUND - GEM_H / 2 - 8 + Math.sin(sg.t * 5) * 5, Math.min(1, sg.t * 4) * 1.1, t, true);
      }
      drawHero(h, G.hero.run, !h.moving);
      // falling rocks
      for (const r of G.rocks) {
        if (r.warn > 0) continue;
        // speed lines above each falling rock
        const len = Math.min(260, r.vy * 0.14);
        const sl = ctx.createLinearGradient(0, r.y - len, 0, r.y + 30);
        sl.addColorStop(0, 'rgba(255,236,200,0)'); sl.addColorStop(1, G.slow > 0 ? 'rgba(143,216,255,0.45)' : 'rgba(255,236,200,0.4)');
        ctx.fillStyle = sl; ctx.fillRect(r.x - ROCK_W * 0.28, r.y - len, ROCK_W * 0.56, len + 30);
        ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
        ctx.shadowColor = 'rgba(10,6,4,0.95)'; ctx.shadowBlur = 14;
        if (img.rock.naturalWidth) ctx.drawImage(img.rock, -ROCK_W / 2, 0, ROCK_W, ROCK_H);
        ctx.restore();
      }
      // particles
      for (const p of G.parts) {
        const a = 1 - p.t / p.life;
        if (p.kind === 'spark') { ctx.fillStyle = `rgba(255,200,110,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill(); }
        else if (p.kind === 'dust') { ctx.fillStyle = `rgba(200,170,130,${a * 0.6})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 0.8, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r + p.t * 8); ctx.fillStyle = `rgba(176,120,58,${a})`; ctx.strokeStyle = `rgba(18,14,11,${a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-p.s / 2, p.s / 2); ctx.lineTo(0, -p.s / 2); ctx.lineTo(p.s / 2, p.s / 2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      }
      for (const f of G.flying) {
        const e = Math.min(1, f.t), x = f.x0 + (BANK_X - f.x0) * e, y = f.y0 + (BANK_Y + BANK_H * 0.5 - f.y0) * e - Math.sin(e * Math.PI) * 120;
        drawGem(x, y, 1 - e * 0.35, t);
      }
      for (const tx of G.texts) { ctx.globalAlpha = 1 - tx.t / 1.2; label(tx.text, Math.min(W - 150, Math.max(150, tx.x)), tx.y - tx.t * 60, 34, tx.color, 'center'); ctx.globalAlpha = 1; }
      // slow time tints the cave icy blue
      if (G.slow > 0) {
        const a = Math.min(1, G.slow * 2, (SLOW_LEN - G.slow) * 4);
        ctx.fillStyle = `rgba(70,150,255,${0.13 * a})`; ctx.fillRect(-20, -20, W + 40, H + 40);
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
        vg.addColorStop(0, 'rgba(60,140,255,0)'); vg.addColorStop(1, `rgba(60,140,255,${0.35 * a})`);
        ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
      }
      // wave change: a warm flash pulses in from the edges
      if (G.pulse > 0) {
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
        vg.addColorStop(0, 'rgba(243,154,53,0)'); vg.addColorStop(1, `rgba(243,154,53,${0.5 * G.pulse})`);
        ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
      }
    } else {
      drawHero(idleHero, idleHero.run, true);
    }
    ctx.restore();

    if (G) drawHud(t);
  }

  function drawHud(t) {

    // haul and wave, centred
    label(String(G.score), W / 2, 228, 64, '#ffd58e', 'center');
    label('WAVE ' + G.wave, W / 2, 280, 28, '#fff1da', 'center');
    ctx.fillStyle = 'rgba(18,14,11,0.7)'; ctx.fillRect(W / 2 - 80, 302, 160, 9);
    ctx.fillStyle = '#5ad6c4'; ctx.fillRect(W / 2 - 80, 302, 160 * (G.waveT / WAVE_LEN), 9);
    label('BEST WAVE ' + Math.max(save.bestWave, G.wave), 26, 46, 24, '#c4ae92');

    // run clock
    label(clock(G.t), 26, 86, 28, '#fff1da');

    // live speed bonus for the current gem, and the slow-time meter
    const rb = rushBonus();
    if (rb > 0 && mode === 'play') label('RUSH +' + rb, W / 2, 342, 28, rb > RUSH_MAX * 0.6 ? '#8fd8ff' : '#5ad6c4', 'center');
    if (G.slow > 0) {
      label('SLOW TIME', W / 2, 386, 26, '#8fd8ff', 'center');
      ctx.fillStyle = 'rgba(18,14,11,0.7)'; ctx.fillRect(W / 2 - 80, 404, 160, 8);
      ctx.fillStyle = '#8fd8ff'; ctx.fillRect(W / 2 - 80, 404, 160 * (G.slow / SLOW_LEN), 8);
    }

    // touch hints: an arrow in each bottom corner, lit while that side is held
    if (mode === 'play' || mode === 'countdown') {
      const side = steer();
      [[-1, 92], [1, W - 92]].forEach(([d, x]) => {
        const on = side === d, y = H - 62;
        ctx.save(); ctx.globalAlpha = on ? 0.95 : 0.4;
        ctx.fillStyle = on ? '#f39a35' : 'rgba(18,14,11,0.55)';
        ctx.strokeStyle = '#120e0b'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, y, 44, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = on ? '#2a1406' : '#fff1da';
        ctx.beginPath(); ctx.moveTo(x + d * 18, y); ctx.lineTo(x - d * 12, y - 20); ctx.lineTo(x - d * 12, y + 20); ctx.closePath(); ctx.fill();
        ctx.restore();
      });
    }

    if (G.banner.t > 0 && mode === 'play') {
      const a = Math.min(1, G.banner.t * 2);
      const pop = 1 + Math.max(0, G.banner.t - 1.9) * 2;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * 0.42); ctx.scale(pop, pop);
      label(G.banner.text, 0, 0, 96, G.banner.color || '#f39a35', 'center');
      if (G.banner.sub) label(G.banner.sub, 0, 72, 34, G.banner.subColor || '#fff1da', 'center');
      ctx.restore();
    }
    if (mode === 'countdown') {
      const n = Math.max(1, Math.ceil(countdown));
      const f = countdown - Math.floor(countdown);
      ctx.save(); ctx.translate(W / 2, H * 0.45); const s = 1 + f * 0.5; ctx.scale(s, s);
      label(String(n), 0, 0, 140, '#ffd58e', 'center'); ctx.restore();
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(now);
    requestAnimationFrame(frame);
  }

  resize();
  Promise.all([
    load('bg', 'assets/bg_portrait.jpg'), load('hero', 'assets/hero.png'),
    load('crystal', 'assets/crystal.png'), load('rock', 'assets/rock.png'),
    document.fonts ? document.fonts.load('40px "Lilita One"').catch(() => {}) : null,
  ]).then(() => {
    try {
      const c = document.createElement('canvas'), im = img.crystal;
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
      for (let i = 0; i < px.length; i += 4) { const r = px[i]; px[i] = px[i + 2] * 0.7; px[i + 1] = px[i + 1] * 0.95; px[i + 2] = Math.min(255, r * 1.05); }
      x.putImageData(d, 0, 0); img.blueGem = c;
    } catch (e) { img.blueGem = img.crystal; }
    goTitle();
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
